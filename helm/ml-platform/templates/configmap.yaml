apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ml-platform.fullname" . }}-config
  labels:
    {{- include "ml-platform.labels" . | nindent 4 }}
data:
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
  MODEL_NAME: {{ .Values.model.name | quote }}
  MODEL_STAGE: {{ .Values.model.stage | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
