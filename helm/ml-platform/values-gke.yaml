image:
  repository: ghcr.io/artur-vol/ml-container-platform-serve
  tag: latest
  pullPolicy: Always
  pullSecret: "ghcr-secret"

mlflow:
  trackingUri: "http://mlflow-proxy:5000"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

gpu:
  enabled: false

ingress:
  enabled: true
  className: nginx
  host: ml-platform.34.140.149.36.nip.io
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
