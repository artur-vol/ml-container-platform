replicaCount: 4

image:
  repository: ghcr.io/artur-vol/ml-container-platform-serve
  tag: latest
  pullPolicy: Always
  pullSecret: "ghcr-secret"

mlflow:
  trackingUri: "http://192.168.0.100:5000"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

gpu:
  enabled: false

track: stable

sharedService:
  enabled: true
  type: NodePort
  nodePort: 30800
