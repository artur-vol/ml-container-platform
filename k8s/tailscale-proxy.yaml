# Tailscale proxy — bridges GKE Autopilot pods to homelab MLflow over Tailscale VPN.
#
# Two containers share the pod network namespace:
#   tailscale  — joins the Tailscale network in userspace mode (TS_USERSPACE=true).
#                Userspace mode is required because GKE Autopilot forbids NET_ADMIN
#                capability and hostPath /dev/net/tun that kernel mode needs.
#                Exposes a SOCKS5 proxy at 127.0.0.1:1055.
#   proxy      — gost forwards TCP :5000 through the SOCKS5 proxy to the homelab
#                Tailscale IP. socat was the original choice but speaks SOCKS4 only;
#                gost supports SOCKS5 natively.
#
# The Service 'mlflow-proxy' makes port 5000 reachable cluster-wide so serve pods
# can use trackingUri: http://mlflow-proxy:5000 without knowing the Tailscale topology.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-mlflow-proxy
  namespace: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-mlflow-proxy
  template:
    metadata:
      labels:
        app: tailscale-mlflow-proxy
    spec:
      containers:
      - name: tailscale
        image: tailscale/tailscale:stable
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        - name: TS_USERSPACE
          value: "true"
        - name: TS_STATE_DIR
          value: /tmp/tailscale
        # Disable Kubernetes Secret storage for Tailscale state — the pod
        # lacks RBAC permissions to read/write Secrets in this namespace.
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_SOCKS5_SERVER
          value: "127.0.0.1:1055"
      - name: proxy
        image: gogost/gost:latest
        args:
        - "-L"
        - "tcp://:5000/100.75.117.56:5000"
        - "-F"
        - "socks5://127.0.0.1:1055"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-proxy
  namespace: ml-platform
spec:
  selector:
    app: tailscale-mlflow-proxy
  ports:
  - port: 5000
    targetPort: 5000
